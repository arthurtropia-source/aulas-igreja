:root{
  --tinta:#2a1d10; --tinta-2:#5b4630; --pergaminho:#efe2c2; --pergaminho-2:#e4d2a8;
  --carmim:#7a1f12; --carmim-2:#a83a26; --ouro:#9a7430; --mar-escuro:#6f8c88;
  --caixa-l: min(36vw, 600px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b140c;overflow:hidden;color:var(--tinta);
  font-family:'Crimson Text',Georgia,'Times New Roman',serif;-webkit-font-smoothing:antialiased}
#palco{position:fixed;inset:0;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none}
#mapa{position:absolute;inset:0;width:100%;height:100%;display:block}

/* terra, mar e as linhas de água em volta da costa */
#terra{fill-rule:evenodd;fill:var(--pergaminho);stroke:var(--tinta-2);stroke-width:1.3;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.onda{fill:none;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.o1{stroke:#7b9893;stroke-width:4.5;opacity:.5}
.o2{stroke:#8aa6a1;stroke-width:10;opacity:.28}
.o3{display:none}

/* rótulos de região, mar e rio (tamanho fixo na tela) */
.reg{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.32em;fill:#6b5638;opacity:.75}
.reg.mar{font-family:'Crimson Text',serif;font-style:italic;font-weight:400;letter-spacing:.22em;fill:#4f6a66}
.reg.rio{font-family:'Crimson Text',serif;font-style:italic;font-weight:400;letter-spacing:.06em;fill:#4a6f93}

/* lugares */
.lugar{transition:opacity .6s ease}
.lugar .nome{font-family:'Crimson Text',serif;font-weight:600;fill:var(--tinta);paint-order:stroke;stroke:var(--pergaminho);stroke-width:4px;stroke-linejoin:round}
.lugar.chave .nome{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.04em}
.lugar.oculto{opacity:0}
.lugar.nevoa{opacity:.32}
.lugar.nevoa .nome{opacity:0}
.lugar .pulso{fill:none;stroke:var(--carmim);stroke-width:2.2;opacity:0;transform-box:fill-box;transform-origin:center}
.lugar.aceso .pulso{animation:pulso 2.2s ease-out infinite}
.lugar.aceso .nome{fill:var(--carmim)}
@keyframes pulso{0%{opacity:.85;transform:scale(.6)}100%{opacity:0;transform:scale(2.8)}}

/* rotas */
.rota{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.rota.terra{stroke:var(--carmim);stroke-width:4;stroke-dasharray:.1 9}
.rota.mar{stroke:#24435f;stroke-width:2.6;stroke-dasharray:11 7}
.rota.estrada{stroke:#5a4a2a;stroke-width:3.2}
.rota.tracejada{stroke:var(--carmim);stroke-width:2.4;stroke-dasharray:6 6;opacity:.8}
.rota.rio{stroke:#5f86ad;stroke-width:3;stroke-dasharray:none}
.trilha .rota{opacity:.42}
.trilha .rota.rio{opacity:.8}

/* cartas em voo */
.voo{fill:none;stroke:var(--ouro);stroke-width:1.6;stroke-dasharray:3 5;vector-effect:non-scaling-stroke;opacity:.8}
.rolo text{font-family:'Cinzel',serif;font-weight:800;fill:var(--carmim)}

/* textura de papel, vinheta e moldura */
#papel{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .33  0 0 0 0 .18  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
  radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(60,35,10,.55) 100%)}
#moldura{position:absolute;inset:10px;pointer-events:none;border:2px solid rgba(90,64,30,.8);
  box-shadow:inset 0 0 0 5px rgba(239,226,194,.25),inset 0 0 0 7px rgba(90,64,30,.6)}
#rosa{position:absolute;right:3.2vw;top:9vh;width:clamp(56px,7vw,110px);opacity:.75;pointer-events:none}

/* topo */
#topo{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:18px;padding:22px 34px;pointer-events:none;
  background:linear-gradient(rgba(27,20,12,.55),rgba(27,20,12,0))}
#topo .titulo-aula{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.18em;font-size:clamp(12px,1.05vw,19px);color:#f3e6c6;text-transform:uppercase}
#topo .trecho{font-family:'Cinzel',serif;font-weight:600;letter-spacing:.14em;font-size:clamp(11px,.95vw,17px);color:#e9c98a;text-transform:uppercase}
#topo .trecho::before{content:'·';margin-right:18px;color:#f3e6c6}
#topo .contador{margin-left:auto;font-family:'Cinzel',serif;font-size:clamp(11px,.95vw,17px);color:#f3e6c6;letter-spacing:.1em}

/* o box */
#caixa{position:absolute;left:3vw;bottom:10vh;width:var(--caixa-l);max-height:74vh;overflow:auto;
  padding:clamp(20px,2.2vw,40px) clamp(22px,2.4vw,44px);
  background:linear-gradient(160deg,#f6ecd2 0%,#ecdcb6 100%);color:var(--tinta);
  border:1.5px solid #8a6a3a;border-radius:3px;
  box-shadow:0 0 0 6px rgba(239,226,194,.55),0 0 0 7.5px rgba(122,90,48,.7),0 18px 50px rgba(0,0,0,.45);
  transition:opacity .45s ease,transform .45s ease;cursor:auto}
#caixa.saindo{opacity:0;transform:translateY(10px)}
body.caixa-direita #caixa{left:auto;right:3vw}
body.caixa-direita #rosa{right:auto;left:3.2vw}
#caixa::before,#caixa::after{content:'';position:absolute;width:22px;height:22px;border:2px solid var(--carmim);opacity:.7}
#caixa::before{top:8px;left:8px;border-right:0;border-bottom:0}
#caixa::after{bottom:8px;right:8px;border-left:0;border-top:0}
#caixa .rotulo{font-family:'Cinzel',serif;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--carmim);font-size:clamp(11px,.95vw,18px);margin-bottom:.6em}
#caixa .titulo{font-family:'Cinzel',serif;font-weight:700;font-size:clamp(20px,2.05vw,40px);line-height:1.18;color:#24180c;margin-bottom:.55em}
#caixa .texto{font-size:clamp(16px,1.32vw,26px);line-height:1.45}
#caixa .nota{font-style:italic;font-size:clamp(13px,1vw,19px);color:#5b4630;margin-top:.9em}
#caixa .nota:empty{display:none}
#caixa .fonte{font-family:'Crimson Text',serif;font-size:clamp(11px,.78vw,15px);color:#7a6646;margin-top:1em;padding-top:.6em;border-top:1px solid rgba(122,90,48,.35)}
body.sem-fontes #caixa .fonte{display:none}

/* barra de progresso */
#progresso{position:absolute;left:3vw;right:3vw;bottom:3.2vh;display:flex;gap:6px;align-items:flex-end;pointer-events:auto}
#progresso .grupo{display:flex;flex-direction:column;gap:5px;flex:var(--n) 1 0}
#progresso .grupo span{font-family:'Cinzel',serif;font-size:clamp(9px,.7vw,13px);letter-spacing:.14em;text-transform:uppercase;color:rgba(243,230,198,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#progresso .marcas{display:flex;gap:4px}
#progresso button{flex:1;height:6px;border:0;border-radius:3px;background:rgba(243,230,198,.35);cursor:pointer;padding:0}
#progresso button.feita{background:rgba(233,201,138,.85)}
#progresso button.atual{background:#e9c98a;box-shadow:0 0 0 2px rgba(122,31,18,.9)}

#ajuda{position:absolute;right:34px;bottom:calc(3.2vh + 26px);font-size:clamp(11px,.8vw,15px);color:rgba(243,230,198,.9);text-shadow:0 1px 3px #000;transition:opacity 1s;pointer-events:none}
#ajuda.some{opacity:0}
#selo{position:absolute;right:30px;top:62px;font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#f3e6c6;background:rgba(122,31,18,.85);padding:3px 9px;border-radius:2px;pointer-events:none}
body.automatico #selo::after{content:' · automático'}

/* celular em pé: o mapa em cima, o box embaixo */
@media (max-aspect-ratio: 1/1){
  #caixa,body.caixa-direita #caixa{left:10px;right:10px;width:auto;bottom:calc(10px + 34px);max-height:44vh;padding:18px 20px 16px}
  #caixa::before,#caixa::after{width:14px;height:14px}
  #caixa .titulo{font-size:clamp(18px,5.2vw,26px)}
  #caixa .texto{font-size:clamp(15px,4.2vw,19px)}
  #caixa .rotulo{font-size:11px}
  #topo{padding:14px 18px;gap:10px}
  #topo .titulo-aula{display:none}
  #topo .trecho::before{display:none}
  #progresso{left:14px;right:14px;bottom:14px}
  #progresso .grupo span{display:none}
  #ajuda{display:none}
  #rosa{top:52px;right:16px;width:46px}
  #selo{top:46px;right:auto;left:18px}
  #moldura{inset:5px}
}

#credito{position:absolute;right:34px;bottom:calc(3.2vh + 4px);font-size:clamp(10px,.75vw,13px);color:rgba(243,230,198,.75);text-shadow:0 1px 3px #000;pointer-events:none;letter-spacing:.03em}
body.sem-fontes #credito{display:none}
@media (max-width:700px){#credito{right:18px}}
</style>
</head>
<body>
<div id="palco">
  <svg id="mapa" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" aria-label="Mapa da viagem">
    <defs>
      <radialGradient id="mar-luz" cx="50%" cy="45%" r="75%">
        <stop offset="0" stop-color="#b9cbc4"/><stop offset="1" stop-color="#93ada8"/>
      </radialGradient>
      <filter id="tinta" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/>

const TORRE = 'M-7,5 L-7,-3 L-5,-3 L-5,-6 L-2.5,-6 L-2.5,-3 L2.5,-3 L2.5,-6 L5,-6 L5,-3 L7,-3 L7,5 Z';
for (const l of D.lugares) {
  const g = el('g', { class: 'lugar oculto' + (l.chave ? ' chave' : '') }, G.lug);
  el('circle', { class: 'pulso', r: 10 }, g);
  if (l.chave) el('path', { d: TORRE, fill: l.cor || '#7a1f12', stroke: '#2a1d10', 'stroke-width': 1.2 }, g);
  else el('circle', { r: 3.8, fill: '#f6ecd2', stroke: '#2a1d10', 'stroke-width': 1.6 }, g);
  const t = el('text', { class: 'nome', x: l.dx * 1.15, y: l.dy * 1.15 + (l.dy > 0 ? 2 : 0), 'font-size': l.chave ? 18 : 15 }, g);
  t.textContent = l.n;
  l.e = g; ESCALAVEIS.push([g, l.x, l.y]);
}

function caminho(pts, ate) {      // a linha até o comprimento "ate" (ou inteira)
  let d = `M${pts[0][0]},${pts[0][1]}`, feito = 0, fim = pts[0];
  for (let i = 1; i < pts.length; i++) {
    const [a, b] = [pts[i - 1], pts[i]], seg = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (ate != null && feito + seg >= ate) {
      const f = (ate - feito) / seg; fim = [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f];
      d += `L${fim[0]},${fim[1]}`; return { d, fim, i };
    }
    d += `L${b[0]},${b[1]}`; feito += seg; fim = b;
  }
  return { d, fim, i: pts.length };
}
const comprimento = pts => pts.slice(1).reduce((s, b, i) => s + Math.hypot(b[0] - pts[i][0], b[1] - pts[i][1]), 0);

function arco(c, n) {             // a curva do voo da carta
  const [a, b] = [c.a, c.b], mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
  const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
  const curva = 0.28 + 0.14 * n, q = [mx + dy * curva * (dx > 0 ? -1 : 1), my - Math.abs(dx) * curva - L * 0.05];
  return t => [(1 - t) ** 2 * a[0] + 2 * (1 - t) * t * q[0] + t * t * b[0], (1 - t) ** 2 * a[1] + 2 * (1 - t) * t * q[1] + t * t * b[1]];
}
function desenharVoo(c, n, pai) {
  const f = arco(c, n); let d = '';
  for (let i = 0; i <= 40; i++) { const p = f(i / 40); d += (i ? 'L' : 'M') + p[0] + ',' + p[1]; }
  return el('path', { class: 'voo', d }, pai);
}
function rolo(rot) {
  const g = el('g', { class: 'rolo' }, G.car);
  el('rect', { x: -13, y: -8, width: 26, height: 16, rx: 3, fill: '#f6ecd2', stroke: '#2a1d10', 'stroke-width': 1.4 }, g);
  el('circle', { cx: -13, cy: 0, r: 8, fill: '#e4d2a8', stroke: '#2a1d10', 'stroke-width': 1.4 }, g);
  el('circle', { cx: 13, cy: 0, r: 8, fill: '#e4d2a8', stroke: '#2a1d10', 'stroke-width': 1.4 }, g);
  el('rect', { x: -2.5, y: -8, width: 5, height: 16, fill: '#7a1f12' }, g);
  const t = el('text', { y: -16, 'text-anchor': 'middle', 'font-size': 17 }, g); t.textContent = rot;
  const item = [g, 0, 0]; ESCALAVEIS.push(item);
  return item;
}
function soltar(item) { item[0].remove(); ESCALAVEIS.splice(ESCALAVEIS.indexOf(item), 1); }

/* ---------- o estado de cada cena ---------- */
function vistos(ate) {            // lugares revelados antes da cena "ate"
  const s = new Set();
  CENAS.slice(0, ate).forEach(c => { c.acender.forEach(n => s.add(n)); c.percursos.forEach(p => p.nomes.forEach(n => LUG[n] && s.add(n))); c.cartas.forEach(k => { s.add(k.de); s.add(k.para); }); });
  return s;
}
function marcarLugares(revelados, acesos) {
  for (const l of D.lugares) {
    const c = l.e.classList;
    c.remove('oculto', 'nevoa', 'aceso');
    if (acesos.has(l.n)) c.add('aceso');
    else if (!revelados.has(l.n)) c.add(l.chave ? 'nevoa' : 'oculto');
  }
}
function limpar() {
  for (const g of [G.tri, G.rot, G.car, G.via]) g.replaceChildren();
  for (let i = ESCALAVEIS.length - 1; i >= 0; i--) if (!ESCALAVEIS[i][0].isConnected) ESCALAVEIS.splice(i, 1);
}
function montarEstado(i, completa) {
  limpar();
  const trilha = el('g', { class: 'trilha' }, G.tri);
  CENAS.slice(0, i).forEach(c => c.percursos.forEach(p => el('path', { class: 'rota ' + p.tipo, d: caminho(p.pts).d }, trilha)));
  CENAS.slice(0, i).forEach(c => c.cartas.forEach((k, n) => desenharVoo(k, n, trilha)));
  const c = CENAS[i], rev = vistos(i);
  if (completa) {
    c.percursos.forEach(p => el('path', { class: 'rota ' + p.tipo, d: caminho(p.pts).d }, G.rot));
    c.cartas.forEach((k, n) => desenharVoo(k, n, G.car));
    vistos(i + 1).forEach(n => rev.add(n));
    marcarLugares(rev, new Set(c.acender));
  } else marcarLugares(rev, new Set());
}

/* ---------- tocar uma cena ---------- */
function bboxDe(pts, folga = 1.25) {
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  const w = Math.max(Math.max(...xs) - Math.min(...xs), 30) * folga, h = Math.max(Math.max(...ys) - Math.min(...ys), 20) * folga;
  return [cx - w / 2, cy - h / 2, cx + w / 2, cy + h / 2];
}
async function percorrer(p, tok) {
  const L = comprimento(p.pts), linha = el('path', { class: 'rota ' + p.tipo }, G.rot);
  const viajante = el('g', {}, G.via);
  el('circle', { r: 15, fill: '#7a1f12', opacity: .22 }, viajante);
  el('circle', { r: 8, fill: '#7a1f12', stroke: '#f6ecd2', 'stroke-width': 2.4 }, viajante);
  const item = [viajante, p.pts[0][0], p.pts[0][1]]; ESCALAVEIS.push(item);
  const dur = Math.min(5200, Math.max(1600, L * vista.s / 0.32));
  const rev = new Set();
  await new Promise((ok, falha) => {
    const t0 = performance.now();
    const passo = agora => {
      if (tok !== rodada) return falha('cancelada');
      const t = Math.min(1, Math.max(0, (agora - t0) / dur)), r = caminho(p.pts, L * (t < 1 ? suave(t) : 1));
      linha.setAttribute('d', r.d);
      item[1] = r.fim[0]; item[2] = r.fim[1];
      viajante.setAttribute('transform', `translate(${r.fim[0]} ${r.fim[1]}) scale(${1 / vista.s})`);
      for (let j = 0; j < r.i; j++) { const n = p.nomes[j]; if (LUG[n] && !rev.has(n)) { rev.add(n); LUG[n].e.classList.remove('oculto', 'nevoa'); } }
      t < 1 ? requestAnimationFrame(passo) : ok();
    };
    requestAnimationFrame(passo);
  });
  p.nomes.forEach(n => LUG[n] && LUG[n].e.classList.remove('oculto', 'nevoa'));
  soltar(item);
}
async function enviarCarta(k, n, tok) {
  const f = arco(k, n), trilho = desenharVoo(k, n, G.car), item = rolo(k.rot);
  trilho.style.opacity = 0;
  await new Promise((ok, falha) => {
    const t0 = performance.now(), dur = 2200;
    const passo = agora => {
      if (tok !== rodada) return falha('cancelada');
      const t = Math.min(1, Math.max(0, (agora - t0) / dur)), p = f(suave(t));
      item[1] = p[0]; item[2] = p[1];
      item[0].setAttribute('transform', `translate(${p[0]} ${p[1]}) scale(${1 / vista.s})`);
      trilho.style.opacity = Math.min(.8, t * 2);
      t < 1 ? requestAnimationFrame(passo) : ok();
    };
    requestAnimationFrame(passo);
  });
  LUG[k.para] && LUG[k.para].e.classList.remove('oculto', 'nevoa');
}
async function tocar(i, tok) {
  const c = CENAS[i];
  montarEstado(i, false);
  if (c.percursos.length) {
    await voar(enquadrar(bboxDe(c.percursos.flatMap(p => p.pts))), null, tok);
    for (const p of c.percursos) await percorrer(p, tok);
    await esperar(250);
  }
  await voar(enquadrar(c.cam), null, tok);
  for (let n = 0; n < c.cartas.length; n++) {
    const fim = enviarCarta(c.cartas[n], n, tok);
    if (n === c.cartas.length - 1) await fim; else await esperar(700);
  }
  if (tok !== rodada) return;
  marcarLugares(vistos(i + 1), new Set(c.acender));
}

/* ---------- o box, o topo e a barra ---------- */
function preencherCaixa(c) {
  caixa.classList.add('saindo');
  setTimeout(() => {
    caixa.querySelector('.rotulo').textContent = c['rótulo'] || '';
    caixa.querySelector('.titulo').textContent = c['título'];
    caixa.querySelector('.texto').textContent = c.texto;
    caixa.querySelector('.nota').textContent = c.nota || '';
    caixa.querySelector('.fonte').textContent = 'Fonte: ' + c.fonte;
    caixa.scrollTop = 0;
    caixa.classList.remove('saindo');
  }, 320);
  $('#topo .trecho').textContent = c.trecho || '';
  $('#topo .contador').textContent = `${cenaAtual + 1} / ${CENAS.length}`;
  document.querySelectorAll('#progresso button').forEach((b, j) => {
    b.classList.toggle('feita', j < cenaAtual); b.classList.toggle('atual', j === cenaAtual);
  });
}
function montarBarra() {
  const nav = $('#progresso'); let grupo = null, nome = null;
  CENAS.forEach((c, j) => {
    if (c.trecho !== nome) {
      nome = c.trecho; grupo = document.createElement('div'); grupo.className = 'grupo';
      grupo.innerHTML = `<span>${nome || ''}</span><div class="marcas"></div>`; nav.appendChild(grupo); grupo.n = 0;
    }
    const b = document.createElement('button'); b.title = c.nome; b.setAttribute('aria-label', c.nome);
    b.onclick = e => { e.stopPropagation(); ir(j, false); };
    grupo.querySelector('.marcas').appendChild(b); grupo.style.setProperty('--n', ++grupo.n);
  });
}

/* ---------- de que lado fica o box: o que esconde menos lugares da cena ---------- */
function pontosDaCena(c) {
  const p = c.acender.map(n => [LUG[n].x, LUG[n].y]);
  c.cartas.forEach(k => p.push(k.a, k.b));
  if (!p.length) p.push([(c.cam[0] + c.cam[2]) / 2, (c.cam[1] + c.cam[3]) / 2]);
  return p;
}
function escondidos(c) {
  medir();
  const v = enquadrar(c.cam), fx = livre.x + livre.w / 2, fy = livre.y + livre.h / 2;
  const r = caixa.getBoundingClientRect(), m = 40;
  return pontosDaCena(c).filter(([x, y]) => {
    const sx = (x - v.cx) * v.s + fx, sy = (y - v.cy) * v.s + fy;
    return sx > r.left - m && sx < r.right + 140 && sy > r.top - m && sy < r.bottom + m;
  }).length;
}
function escolherLado(c) {
  const corpo = document.body.classList;
  if (W / H <= 1 || c.caixa) { corpo.toggle('caixa-direita', c.caixa === 'direita'); medir(); return; }
  corpo.remove('caixa-direita'); const esq = escondidos(c);
  corpo.add('caixa-direita'); const dir = escondidos(c);
  corpo.toggle('caixa-direita', dir < esq);
  medir();
}

/* ---------- navegação ---------- */
async function ir(i, animar = true) {
  i = Math.max(0, Math.min(CENAS.length - 1, i));
  const anterior = cenaAtual, tok = ++rodada;
  cenaAtual = i; history.replaceState(null, '', '#' + (i + 1));
  const c = CENAS[i];
  preencherCaixa(c);
  escolherLado(c);
  const t0 = performance.now();
  try {
    if (animar && i === anterior + 1) await tocar(i, tok);
    else { montarEstado(i, true); await voar(enquadrar(CENAS[i].cam), anterior < 0 ? 1 : 900, tok); }
  } catch (e) { return; }
  document.body.dataset.pronta = i + 1;
  if (automatico && tok === rodada && i < CENAS.length - 1) {
    await esperar(Math.max(1500, (CENAS[i].dur || 10) * 1000 - (performance.now() - t0)));
    if (automatico && tok === rodada) ir(i + 1);
  }
}
const avancar = () => ir(cenaAtual + 1), voltar = () => ir(cenaAtual - 1, false);

document.addEventListener('keydown', e => {
  if (['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); avancar(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); voltar(); }
  else if (e.key === 'Home') ir(0, false);
  else if (e.key === 'End') ir(CENAS.length - 1, false);
  else if (/^[fF]$/.test(e.key)) document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  else if (/^[aA]$/.test(e.key)) { automatico = !automatico; document.body.classList.toggle('automatico', automatico); if (automatico) avancar(); }
  else if (/^[nN]$/.test(e.key)) document.body.classList.toggle('sem-fontes');
  $('#ajuda').classList.add('some');
});
let toque = null;
$('#palco').addEventListener('touchstart', e => { toque = [e.touches[0].clientX, e.touches[0].clientY]; }, { passive: true });
$('#palco').addEventListener('touchend', e => {
  if (!toque) return;
  const dx = e.changedTouches[0].clientX - toque[0], dy = e.changedTouches[0].clientY - toque[1];
  if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? avancar() : voltar(); toque = 'feito'; }
}, { passive: true });
$('#palco').addEventListener('click', e => {
  if (toque === 'feito') { toque = null; return; }
  if (e.target.closest('#caixa, #progresso')) return;
  e.clientX < W * 0.25 ? voltar() : avancar();
  $('#ajuda').classList.add('some');
});
addEventListener('resize', () => { medir(); if (cenaAtual >= 0) aplicar(enquadrar(CENAS[cenaAtual].cam)); });

/* ---------- começo ---------- */
$('#topo .titulo-aula').textContent = (D.meta['título'] || '').split('·')[0].trim();
if (D.meta['versão']) $('#selo').textContent = 'prévia · ' + D.meta['versão'].split('·')[0].replace('prévia', '').trim(); else $('#selo').remove();
montarBarra(); medir(); aplicar(prender({ cx: BW / 2, cy: BH / 2, s: sMin() }));
setTimeout(() => $('#ajuda').classList.add('some'), 6000);
const h = parseInt(location.hash.slice(1), 10);
ir(h > 0 ? h - 1 : 0, false);
window.__viagem = { ir, CENAS, get cena() { return cenaAtual; } };
})();
</script>
